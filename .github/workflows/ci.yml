name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt ruff

      - name: Lint (syntax / undefined names / unused)
        run: ruff check --select E9,F calculator firmware tests

      # The calculator math and the firmware's scheduling / NMEA-parsing logic.
      # firmware/main.py's MicroPython `machine` module is faked in
      # tests/conftest.py so it imports and runs on desktop CPython.
      - name: Run tests
        run: pytest -q
